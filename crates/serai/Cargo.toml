[package]
name = "serai"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
futures-lite = "2.6.1"
iroh = "1.0.3"
iroh-blobs = "0.103.0"
iroh-docs = "0.101.0"
iroh-gossip = "0.101.0"
mime_guess = "2.0.5"
reqwest = { version = "0.13.4", features = ["json"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
